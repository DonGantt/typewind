name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-wasip1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/typewind/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/typewind/Cargo.lock') }}

      # --ignore-scripts: examples/*'s postinstall runs `typewind generate`,
      # which needs a local Tailwind CSS entry file the examples don't ship
      # (they're meant to be run interactively, not installed headlessly).
      # Not needed to build/test packages/typewind itself.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build typewind
        run: npm run build --workspace packages/typewind

      - name: Run tests
        run: npm test
