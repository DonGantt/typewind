name: Finalize Release

# Fires once a "release: ..." PR (development -> main, opened by
# release-pr.yml) is merged by a human. Runs release-it in packages/typewind
# to bump the version, tag, cut a GitHub release, and publish to npm.
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  # examples/*'s postinstall runs `typewind generate`, which needs a local
  # Tailwind CSS entry file the examples don't ship (they're meant to be run
  # interactively, not installed headlessly). The explicit `--ignore-scripts`
  # on `npm ci` below only covers that one command - release-it's version
  # bump internally calls `npm version`, which re-syncs the workspace lockfile
  # and reruns every workspace's lifecycle scripts unless scripts are
  # disabled globally, hence this env var rather than just the CLI flag.
  npm_config_ignore_scripts: "true"

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'release:'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --ignore-scripts: examples/*'s postinstall runs `typewind generate`,
      # which needs a local Tailwind CSS entry file the examples don't ship
      # (they're meant to be run interactively, not installed headlessly).
      # Not needed to build/publish packages/typewind itself.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --workspace packages/typewind

      # Increment defaults to patch; pass a different bump by re-dispatching
      # release-pr.yml manually and merging, or running release-it locally
      # for a minor/major.
      # release-it handles the version bump, git tag, and GitHub release; npm
      # publishing itself is disabled here (packages/typewind/.release-it.json
      # sets npm.publish: false) so the separate, environment-gated `publish`
      # job below can publish via OIDC trusted publishing instead.
      - name: Bump version, tag, and create GitHub release
        working-directory: packages/typewind
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci --increment=patch

      - name: Capture new tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --workspace packages/typewind

      - name: Stage publish to npm
        working-directory: packages/typewind
        run: npm stage publish --provenance

      - name: List pending stages
        working-directory: packages/typewind
        run: npm stage list
